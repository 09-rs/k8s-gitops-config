apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: slack-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  route:
    receiver: slack
    groupBy:
      - alertname
    groupWait: 10s
    groupInterval: 5m
    repeatInterval: 4h

  receivers:
    - name: slack
      slackConfigs:
        - apiURL:
            name: alertmanager-slack-webhook
            key: webhook-url
          channel: "#pipeline-alerts"
          sendResolved: true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-b
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/09-rs/k8s-gitops-config.git
    targetRevision: main
    path: charts/service-b
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true